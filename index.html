<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Quote Saver</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background-color: white;
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #6c5ce7;
        }

        #add-btn {
            padding: 12px 20px;
            background-color: #6c5ce7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        #add-btn:hover {
            background-color: #5b4cc4;
        }

        #quote-list {
            list-style: none; 
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

     
        .quote-card {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #6c5ce7; 
            display: flex;
            justify-content: space-between; 
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            animation: fadeIn 0.3s ease;
        }

        .quote-text {
            font-size: 1.1rem;
            color: #555;
            font-style: italic;
            margin-right: 10px;
        }

        .quote-text::before { content: "“"; font-weight: bold; color: #6c5ce7; }
        .quote-text::after { content: "”"; font-weight: bold; color: #6c5ce7; }

        .delete-btn {
            background: none;
            border: none;
            color: #ff7675;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .delete-btn:hover {
            background-color: #ffeaea;
            color: #d63031;
        }

        .empty-msg {
            text-align: center;
            color: #aaa;
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>💬 Quote Saver</h1>

        <!-- Input Area -->
        <div class="input-group">
            <input type="text" id="quote-input" placeholder="Type a quote here...">
            <button id="add-btn">Add</button>
        </div>

        <!-- List Area -->
        <ul id="quote-list">
            <!-- - <li class="quote-card"> 
                 <span class="quote-text"></span>
                <button class="delete-btn">🗑️</button>
            </li>   -->
            
        </ul>
    </div>

    <script>
        // YOUR JS MISSION STARTS HERE
        let quotes = JSON.parse(localStorage.getItem('quote')) || [];
        const btn = document.querySelector('#add-btn')
        const text = document.querySelector('.quote-text')
        function drawing(text){
            const li = document.createElement('li');
            li.innerText = text;
            li.classList.add('quote-card')
            const ul = document.querySelector('#quote-list')
            ul.appendChild(li)
             const delbtn = document.createElement('button')
            delbtn.innerText = '🗑️'
            li.appendChild(delbtn)
             delbtn.addEventListener('click', function(e){
                // li.classList.add('delete.btn')
                li.remove()
                const index = quotes.indexOf(text)
                if ( index > -1){
                    quotes.splice(index, 1)
                }
                localStorage.setItem('quote', JSON.stringify(quotes))

            })
            
        }
        btn.addEventListener('click', function(){
            const text = document.querySelector('#quote-input')
            const input = text.value;
            if ( input !== ""){
            drawing(input)
            quotes.push(input)
            localStorage.setItem('quote', JSON.stringify(quotes))
            
            text.value = ''
            }
            
           
        })
        for ( let i = 0; i < quotes.length ; i++){
             drawing(quotes[i])
        }


        
    </script>

</body>
</html>
